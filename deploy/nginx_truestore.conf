# Example nginx reverse-proxy config for TrueStore Operations, meant to sit
# ALONGSIDE your other apps' existing nginx configs, not replace anything.
#
# Before using this file:
#   1. Pick a port not already used by one of your other 5-6 apps:
#        sudo ss -tlnp | grep LISTEN
#      Every "127.0.0.1:XXXX" or "0.0.0.0:XXXX" line is taken - pick
#      something else (this file defaults to 8010; change every occurrence
#      of 8010 below - and in deploy/truestore.service - if it's taken too).
#   2. Pick a subdomain that isn't already claimed by another app's nginx
#      server_name (check `grep -r server_name /etc/nginx/sites-enabled/`) -
#      e.g. truestore.your-domain.example.com. Don't point this at your bare
#      root domain if another app already owns it.
#
# Copy to /etc/nginx/sites-available/truestore, symlink into
# sites-enabled, then `sudo nginx -t && sudo systemctl reload nginx`.
# `nginx -t` will tell you immediately if something conflicts.

server {
    listen 80;
    server_name truestore.your-domain.example.com;

    # Let certbot answer ACME challenges here for certificate issuance/renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else: redirect to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name truestore.your-domain.example.com;

    ssl_certificate     /etc/letsencrypt/live/truestore.your-domain.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/truestore.your-domain.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 25M;  # matches app.py's MAX_CONTENT_LENGTH (20MB) with headroom

    location / {
        proxy_pass http://127.0.0.1:8010;  # <- must match the port gunicorn/waitress binds to
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
