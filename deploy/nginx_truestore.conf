# Nginx reverse proxy for TrueStore Operations.
# Customize server_name, then:
#   sudo cp deploy/nginx_truestore.conf /etc/nginx/sites-available/tsopr
#   sudo ln -s /etc/nginx/sites-available/tsopr /etc/nginx/sites-enabled/tsopr
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d tsop.true-app.in

server {
    listen 80;
    server_name tsop.true-app.in;

    location /static/ {
        alias /opt/tsopr/app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location / {
        proxy_pass         http://127.0.0.1:8020;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_redirect     off;
        client_max_body_size 25M;
    }
}
