<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change Password · TrueStore Operations</title>
<link rel="stylesheet" href="/static/mobile.css?v=3">
<link rel="stylesheet" href="/static/global.css?v=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  :root{ --paper:#f6f3ec; --paper-raised:#fffdf8; --ink:#1c2321; --ink-soft:#5c645f; --rule:#e2dccb; --rule-strong:#c9c2ab; --paid:#3f6b4f; --paid-soft:#e2ede4; --overdue:#a3452e; --overdue-soft:#f3e3dd; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;}
  .wrap{max-width:440px;margin:0 auto;padding:48px 24px 80px;}
  .top-nav{margin-bottom:20px;font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .top-nav a{color:var(--ink-soft);text-decoration:none;border:1px solid var(--rule-strong);padding:6px 12px;border-radius:2px;}
  h1{font-family:'Fraunces',serif;font-size:24px;margin:0 0 20px;}
  .card{background:var(--paper-raised);border:1px solid var(--rule-strong);border-radius:3px;padding:24px;}
  label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-bottom:4px;margin-top:14px;}
  input[type=password]{width:100%;font-size:14px;padding:10px 12px;border:1px solid var(--rule-strong);border-radius:2px;background:#fff;color:var(--ink);}
  .btn{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:10px 18px;border-radius:2px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;margin-top:18px;width:100%;}
  .flash{padding:10px 12px;border-radius:2px;font-size:12.5px;margin-bottom:14px;background:var(--overdue-soft);color:var(--overdue);border:1px solid var(--overdue);}
</style>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>
<body>
<div class="wrap">
  <div class="top-nav"><a href="/">&larr; Dashboard</a></div>
  <h1>Change Password</h1>
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  <div class="card">
    <form method="post">
      <label for="current_password">Current password</label>
      <input type="password" id="current_password" name="current_password" required>
      <label for="new_password">New password (min 8 characters)</label>
      <input type="password" id="new_password" name="new_password" required minlength="8">
      <label for="confirm_password">Confirm new password</label>
      <input type="password" id="confirm_password" name="confirm_password" required minlength="8">
      <button class="btn" type="submit">Change Password</button>
    </form>
  </div>
</div>
</body>
</html>
