<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request Money · TrueStore Operations</title>
<link rel="stylesheet" href="/static/mobile.css?v=3">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  :root{ --paper:#f6f3ec; --paper-raised:#fffdf8; --ink:#1c2321; --ink-soft:#5c645f; --rule-strong:#c9c2ab; --overdue:#a3452e; --overdue-soft:#f3e3dd; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;}
  .wrap{max-width:480px;margin:0 auto;padding:28px 24px 80px;}
  .top-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .top-nav a{color:var(--ink-soft);text-decoration:none;border:1px solid var(--rule-strong);padding:6px 12px;border-radius:2px;}
  h1{font-family:'Fraunces',serif;font-size:24px;margin:0 0 20px;}
  .card{background:var(--paper-raised);border:1px solid var(--rule-strong);border-radius:3px;padding:20px;}
  label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin:14px 0 5px;}
  label:first-child{margin-top:0;}
  input, select{width:100%;font-size:14px;padding:10px 11px;border:1px solid var(--rule-strong);border-radius:2px;background:#fff;color:var(--ink);}
  .checkbox-row{display:flex;align-items:center;gap:8px;margin-top:16px;}
  .checkbox-row input{width:auto;}
  .checkbox-row label{margin:0;text-transform:none;font-family:'Inter',sans-serif;font-size:13px;letter-spacing:0;color:var(--ink);}
  .btn{margin-top:22px;font-family:'IBM Plex Mono',monospace;font-size:13px;padding:11px 20px;border-radius:2px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;}
  .flash{background:var(--overdue-soft);color:var(--overdue);border:1px solid var(--overdue);padding:10px 12px;border-radius:2px;font-size:12.5px;margin-bottom:16px;}
  .hint{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);margin-top:4px;}
</style>
<link rel="stylesheet" href="/static/infinite_scroll.css?v=1">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
</head>
<body>
<div class="wrap">
  <div class="top-nav"><a href="/money-requests">&larr; My Requests</a>{% if logged_in_user %}<span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);">{{ logged_in_user.username }} ({{ role_labels.get(logged_in_user.role, logged_in_user.role) }}) &middot; <a href="/logout" style="color:var(--ink-soft);">Log out</a></span>{% endif %}</div>
  <h1>Request Money</h1>

  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}

  <div class="card">
    <form method="post">
      <label for="amount">Amount (₹)</label>
      <input type="number" id="amount" name="amount" step="1" min="1" required>

      <label for="reason">Reason</label>
      <select id="reason" name="reason" onchange="toggleGstField()" required>
        {% for r in reasons %}<option value="{{ r.label }}">{{ r.label }}</option>{% endfor %}
      </select>

      <label for="note">Note (optional)</label>
      <input type="text" id="note" name="note" placeholder="What's this for?">

      <div class="checkbox-row" id="gstRow">
        <input type="checkbox" id="is_gst_bill" name="is_gst_bill" checked>
        <label for="is_gst_bill">This will be a GST bill (uncheck for cash/non-GST purchases)</label>
      </div>

      <button class="btn" type="submit">Submit Request</button>
    </form>
  </div>
</div>

<script>
function toggleGstField(){
  const reason = document.getElementById('reason').value;
  document.getElementById('gstRow').style.display = (reason === 'Purchase') ? 'flex' : 'none';
}
toggleGstField();
</script>
<script src="/static/infinite_scroll.js?v=1"></script>
</body>
</html>
